<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대구특별시</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #fff;
      color: #000;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul,
    li {
      list-style: none;
    }

    .wrapper {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background-color: #fff;
    }

    .container {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER */
    header.header {
      width: 100%;
      height: 100px;
      border-bottom: 1px solid lightgray;
      position: relative;
      z-index: 2;
    }

    header .container {
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo img {
      height: 60px;
      object-fit: contain;
    }

    .util a {
      font-size: 16px;
      color: #333;
    }

    /* NAVIGATION */
    nav.mainnav {
      width: 100%;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      position: relative;
      z-index: 2;
    }

    nav .container {
      position: relative;
    }

    .mainmenu {
      display: flex;
      justify-content: center;
      gap: 120px;
      height: 60px;
      align-items: center;
      position: relative;
    }

    .mainmenu > li > a {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      padding: 0 20px;
      height: 60px;
    }

    .submenu {
      opacity: 0;
      visibility: hidden;
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      padding: 30px 40px;
      background-color: #fff;
      box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    nav.mainnav:hover .submenu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .submenu li {
      margin-right: 40px;
      text-align: center;
    }

    .submenu li strong {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      display: block;
      color: #000;
    }

    .submenu li a {
      display: block;
      padding: 8px 0;
      font-size: 14px;
      color: #333;
      white-space: nowrap;
    }

    /* FOOTER */
    footer.footer {
      background-color: #001f3f;
      color: #fff;
      padding: 40px 0;
    }

    footer .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-size: 14px;
    }

    .foot-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .foot-links a {
      color: #aaa;
      font-size: 14px;
    }

    .copyright {
      font-size: 13px;
      color: #777;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      header .container,
      nav .container,
      footer .container {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .mainmenu {
        flex-direction: column;
        gap: 10px;
        height: auto;
        padding: 10px 0;
      }

      .mainmenu > li > a {
        height: 40px;
        padding: 10px;
      }

      .submenu {
        flex-direction: column;
        position: static;
        width: 100%;
        box-shadow: none;
        padding: 10px 0;
        transform: none;
        opacity: 1 !important;
        visibility: visible !important;
      }

      .submenu li {
        margin: 10px 0;
      }

      nav.mainnav:hover .submenu {
        display: flex;
      }

      .logo img {
        height: 50px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <!-- HEADER -->
    <header class="header">
      <div class="container">
        <div class="logo">
          <a href="#">
            <img src="./KakaoTalk_20250717_170402791.png" alt="대구특별시 로고" />
          </a>
        </div>
        <div class="util">
          <a href="#">로그인</a>
        </div>
      </div>
    </header>

    <!-- NAVIGATION -->
    <nav class="mainnav">
      <div class="container">
        <ul class="mainmenu">
          <li><a href="#">민원·소통·참여</a></li>
          <li><a href="#">정보공개</a></li>
          <li><a href="#">대구소개</a></li>
          <li><a href="#">분야별정보</a></li>

          <ul class="submenu">
            <li>
              <strong>민원·소통·참여</strong>
              <a href="#">자유게시판</a>
              <a href="#">두드려라</a>
              <a href="#">공익제보</a>
              <a href="#">정책토론</a>
              <a href="#">지방분권</a>
            </li>
            <li>
              <strong>정보공개</strong>
              <a href="#">행정정보공개</a>
              <a href="#">알림정보</a>
              <a href="#">감사정보</a>
              <a href="#">통계정보</a>
              <a href="#">공공저작물</a>
            </li>
            <li>
              <strong>대구소개</strong>
              <a href="#">시정비전</a>
              <a href="#">시청안내</a>
              <a href="#">일반현황</a>
              <a href="#">대구의 상징</a>
              <a href="#">역사</a>
            </li>
            <li>
              <strong>분야별정보</strong>
              <a href="#">교통</a>
              <a href="#">복지</a>
              <a href="#">보건</a>
              <a href="#">산업·경제</a>
              <a href="#">도시주택·건설</a>
            </li>
          </ul>
        </ul>
      </div>
    </nav>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="container">
        <div class="foot-links">
          <a href="#">개인정보처리방침</a>
          <a href="#">이메일무단수집거부</a>
          <a href="#">저작권정책</a>
          <a href="#">오시는길</a>
        </div>
        <div class="copyright">
          © 2025 Daegu Special City. All rights reserved.
        </div>
      </div>
    </footer>

  </div>
</body>

</html>
