<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            font-size: 16px;
            
        }
        body{
            background-color: white;
            color: black;
        }
        .wrapper{
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
        }
        main{
            padding: 40px;
        }
        section{
            background-color: white;
            padding: 30px;
            margin-bottom: 40px;
            border-radius: 10px;
        }
        /* 비디오 */

        body::-webkit-scrollbar{
            display: none;
        }
        .bg-video{
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 800px;
            z-index: -2;
        }
        .bg-video>video{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay-text{
            position: absolute;
            top: 5%;
            left: 10px;
            /* transform: translate(-50%, -300%); */
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

    </style>

</head>

<body>

    <div class="overlay-text">함께하는 대구</div>
    <div class="daegu">
    <div class="bg-video">
        <div class="overlay"></div>
        
        <video src="daeguvideo.mp4"autoplay muted loop>
        
        </video>
        </div>
    </div>

</body>

</html>
