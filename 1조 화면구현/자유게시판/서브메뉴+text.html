<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./basic.css">
    <!-- home icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24;
            font-size: 24px;
        }

        /* .big-icon {
            font-size: 100px;
        } */

        .chat_icon {
            font-size: 30px;
        }
    </style>

    <style>
        .wrapper {
            /* background-color: rgb(243, 247, 175); */

            height: auto;
        }





        .main {
            display: flex;
            gap: 50px;
        }

        .subtitle {
            position: relative;
            width: 240px;
            height: 50px;
            border-radius: 5px;
            background-color: #000080;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-size: 1rem;
            margin-bottom: 12px;

        }

        .submain {
            position: relative;
            width: 240px;
            height: 500px;
        }

        .comment-tog {
            border: 1px solid;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            height: 43px;

        }

        .tog1 {
            padding-right: 10px;
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }


        .comment-tog>p {
            margin: 0;
        }

        .comment-tog>p>a {
            color: black;
            text-decoration-line: none;
        }

        #arrow {
            position: relative;
            top: 3px;
            right: 5px;
            width: 10px;
            height: 10px;
            border-top: 2px solid black;
            border-left: 2px solid black;
            transform: rotate(-135deg);
        }

        .comment {
            display: none;
            list-style: '-';
            padding-left: 20px;
            margin: 10px;

        }

        .comment>li {
            padding: 5px;
        }

        .show {
            display: block;
        }

        .board {
            width: 930px;
            height: auto;
        }

        .board>h1 {
            font-size: 2rem;
        }

        .board>.t1 {
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .board>.t1>.t1path {
            width: 100%;
            display: flex;
        }

        .t1button {
            width: 100%;
            display: flex;
            gap: 5px;
            justify-content: end;
            position: relative;
        }

        .t1button>.t1btn {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border: 1px solid lightgray;
            border-radius: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        .t1btn:nth-child(2) {
            font-size: 15px;
        }

        .t1btn:nth-child(3) {
            font-size: 15px;
        }

        .t1btn:nth-child(4) {
            font-weight: 600;
        }

        .t1btn:nth-child(5) {
            font-weight: 200;
        }

        .t1btnimg {
            width: 100%;
            height: 100%;
        }

        @media screen and (max-width : 900px) {
            .wrapper {
                max-width: 900px;
            }

            .main {
                flex-direction: column;
                gap: 30px;
            }

            .submain {
                width: 100%;
                height: auto;
            }

            .subtitle {
                position: relative;
                width: 100%;
                height: 50px;
                /* margin-bottom: 12px; */
            }

            .board {
                width: 100%;

            }

            .t4 {
                height: auto;
            }

        }
    </style>


</head>

<body>

    <div class="wrapper">
        <div class="main">
            <div class="cal">
                <div class="subtitle">
                    <div class="icon">
                        <span class="material-symbols-outlined chat_icon">
                            chat
                        </span>
                    </div>
                    <div class="subtitle_text">민원소통참여</div>
                </div>
                <div class="submain">
                    <section>
                        <div class="comment-tog tog1">
                            <p>민원실 안내</p>
                            <p id="arrow"></p>
                        </div>
                        <ul class="comment">
                            <li>종합민원실 안내</li>
                            <li>복합민원상담 사전예약</li>
                            <li>정부24</li>
                        </ul>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p>두드리소(민원신청)</p>
                            <p id="arrow"></p>
                        </div>
                        <ul class="comment">
                            <li>두드리소란</li>
                            <li>민원신청</li>
                            <li>찾아가는 민원</li>
                        </ul>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p><a href="javascript:void(0)">시장에게바란다</a></p>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5" />
                                <path fill-rule="evenodd"
                                    d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z" />
                            </svg>
                        </div>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p>공익제보</p>
                            <p id="arrow"></p>
                        </div>
                        <ul class="comment">
                            <li>공익제보란?</li>
                            <li>공익제보자 보호 및 보상 제도</li>
                        </ul>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p><a href="javascript:void(0)">공공재정 부정청구 신고</a></p>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5" />
                                <path fill-rule="evenodd"
                                    d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z" />
                            </svg>
                        </div>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p>행정서비스 현장</p>
                            <p id="arrow"></p>
                        </div>
                        <ul class="comment">
                            <li>헌장전문</li>
                            <li>공통이행기준</li>
                            <li>분야별이행기준</li>
                        </ul>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p>시민참여</p>
                            <p id="arrow"></p>
                        </div>
                        <ul class="comment">
                            <li>자유게시판</li>
                            <li>칭찬합시다</li>
                            <li>시민 생활안전 지킴이</li>
                        </ul>
                    </section>
                    <section>
                        <div class="comment-tog tog1">
                            <p><a href="javascript:void(0)">제안/설문/투표</a></p>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5" />
                                <path fill-rule="evenodd"
                                    d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z" />
                            </svg>
                        </div>
                    </section>
                </div>
            </div>



            <script>

                const toggle = document.querySelectorAll(".comment-tog");
                toggle.forEach((tog) =>
                    tog.addEventListener("click", function () {
                        const cont = tog.nextElementSibling; //내가 클릭한 것의 형재 == comment
                        const cont2 = tog.firstElementChild;

                        cont.classList.toggle("show");

                        // console.log(cont.classList.value); // comment show / comment
                        // console.log(value1 =='comment'); // flase / true

                        const value1 = cont.classList.value;


                        if ((value1 == 'comment') == false) {
                            //comment show
                            tog.style.backgroundColor = "#4174b9";
                            cont2.setAttribute("style", " padding: 0;width:100%; height: 100%; color:white;");

                            // 추가 테스트

                            if (cont.classList.contains("show")) { //전 comment가 열려있다면 
                                const cont3 = document.querySelectorAll(".comment")
                                cont3.forEach(c => {
                                    if (c !== cont) {       //comment ==  전comment
                                        c.classList.remove("show"); //comment 닫힘

                                        const othertog = c.previousElementSibling;  //닫힌comment의 윗 형재 변수 지정 
                                        if (othertog) {
                                            othertog.style.backgroundColor = "white";
                                            if (othertog.firstElementChild) {
                                                othertog.firstElementChild.setAttribute("style", "padding: 0; width:100%; height: 100%; color:black;"
                                                );
                                            }
                                        }
                                    }
                                });
                            }
                            // 테스트 끝
                        }
                        else {
                            //comment 
                            tog.style.backgroundColor = "white";
                            cont2.setAttribute("style", " padding: 0;width:100%; height: 100%; color:black;");
                        }

                    })
                );





            </script>

</body>

</html>
