<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper{
            font-size: 10px;
            padding: 10px;
            
        }
        .wrapper>main>section>.card-container{
            display: flex;
            width: 100vw;
            gap: 20px;
            flex-wrap: wrap;
            
        }
        .wrapper>main>section>.card-container>.card{
            border: 1px solid;
            border-radius: 10px;
            padding: 10px;

            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 480px;
            max-width: 480px;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <main>
            <section>
                <h1>공지사항</h1>
                <div class="card-container">
                    <div class="card">
                        <h2>전국민마음투자지원사업 안내</h2>
                        <p>1.사업기간:2025년 연중(예산소진시 까지) 2.지원대상:우울,불안 등...</p>
                    <div class="card">
                        <h2>여름 온열질환 주의사항 안내</h2>
                        <p>폭염 대비 온열질환 예방, 건강수칙 1. 물 자주 마시기 -갈증을 느끼...</p>
                    <div class="card">
                        <h2>장마철 주의사항 안내</h2>
                        <p>장마철 대비 사고 예방수칙 1. 침수 위험 지역 피하기 -하천변이나 계곡 등...</p>
            </section>
        </main>
    </div>
    
</body>
</html>
