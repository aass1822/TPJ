<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .login-container {
            background: linear-gradient(royalblue, gray );
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
        }

        .login-box {
            background: lightgray;
            width: 460px;
            padding: 30px 40px;
            border: 1px solid #ddd;
            box-shadow: 5px 4px 20px;
            border-radius: 4px;
            font-family: "Noto Sans KR", sans-serif;
        }

        .login-box h2 {
            color: #004488;
            margin-bottom: 10px;
            font-size: 26px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        .login-box p {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .login-form input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .login-btn {
            background-color: #0066cc;
            color: white;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .simple-login {
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            justify-items: center;
        }

        .simple-login button {
            background: none;
            border: none;
            cursor: pointer;
        }

        .simple-login img {
            width: 36px;
            height: 36px;
        }

        .login-notice {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            padding-left: 15px;
        }

        .login-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .signup-btn {
            background-color: #f57c00;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 3px;
        }

        .find-btn {
            background-color: #d81b60;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="login-box">
            <h2>LOGIN</h2>
            <p>회원가입 하신 아이디와 비밀번호를 입력 후 로그인 버튼을 클릭해 주세요.<br>
                비회원의 경우 회원 가입을 통해 로그인하실 수 있습니다.</p>

            <form class="login-form">
                <input type="text" placeholder="아이디" required>
                <input type="password" placeholder="비밀번호" required>
                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="simple-login">
                <button><img src="kakao.png" alt="카카오"> </button>
                <button><img src="naver.png" alt="네이버"> </button>
                <button><img src="toss.png" alt="토스"> </button>
                <button><img src="pass.png" alt="PASS"> </button>
                <button><img src="samsung.png" alt="삼성"> </button>
                <button><img src="kb.png" alt="KB"> </button>
                <button><img src="kftc.png" alt="공동인증서"> </button>
            </div>

            <ul class="login-notice">
                <li>※ 이용 시 주의 사항 ※</li>
                <li>· 인증기관에서 발급받은 인증서가 있어야 간편인증 이용 가능</li>
                <li>· 간편인증은 원클릭회원(대상: 성인 및 외국인) 회원만 이용 가능</li>
                <li>· 만14세 미만 및 회원가입 이력이 없는 회원은 이용 불가</li>
                <li>· 장기(1년 이상) 미이용회원의 기존의 회원 가입정보는 자동 삭제됩니다</li>
            </ul>

            <div class="login-links">
                <a href="#" class="signup-btn">회원가입</a> <!-- # : 상단으로 이동 -->
                <a href="#" class="find-btn">아이디/비밀번호 찾기</a>
            </div>
        </div>
    </main>

</body>

</html>
